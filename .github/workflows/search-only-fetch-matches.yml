name: Patch search-only fixture discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'patch: make fixture discovery fetch_url/search only') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch tools.ts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/agent/tools.ts')
          s=p.read_text()
          old="""export async function fetchMatchesToday(sport='football',dateStr?:string):Promise<ToolResult>{const today=dateStr||new Date().toISOString().slice(0,10);const sources=['https://www.livescore.com/en/','https://www.bbc.com/sport/football/scores-fixtures','https://www.azscore.com/football/today.html','https://www.scoreboard.com/en/','https://footystats.org/today/'];const [flash,...rest]=await Promise.allSettled([scrapeFlashscore(dateStr),...sources.map(u=>fetchUrl(u))]);const data:string[]=[];if(flash.status==='fulfilled'&&flash.value.success)data.push(`=== FLASHSCORE ===\\n${flash.value.data}`);rest.forEach((r,i)=>{if(r.status==='fulfilled'&&r.value.success&&!r.value.blocked)data.push(`=== ${sources[i]} ===\\n${r.value.data.slice(0,4000)}`);});if(data.length)return{success:true,data:`[Date: ${today}] [Sport: ${sport}]\\n${data.join('\\n\\n').slice(0,20000)}`,source:'fetch_matches_today:local-browser'};return taloredataSearch(`football matches fixtures today ${today} kickoff times schedule`);}"
          new="""export async function fetchMatchesToday(sport='football',dateStr?:string):Promise<ToolResult>{const raw=String(dateStr||'');const m=raw.match(/\\b\\d{4}-\\d{2}-\\d{2}\\b/);const today=m?.[0]||new Date().toISOString().slice(0,10);const discovered=await Promise.allSettled([serpSearch(`football fixtures ${today} schedule site:livescore.com OR site:bbc.com/sport OR site:footystats.org`),taloredataSearch(`football fixtures ${today} schedule site:livescore.com OR site:bbc.com/sport OR site:footystats.org`),duckDuckGoFeedSearch(`football fixtures ${today} schedule`)]);const urls:string[]=[];for(const r of discovered){if(r.status==='fulfilled'&&r.value.success){const matches=r.value.data.match(/https?:\\/\\/[^\\s)]+/g)||[];for(const u of matches)if(/livescore|bbc\\.com|footystats|scoreboard|goal\\.com|flashscore/i.test(u))urls.push(u.replace(/[),.;]+$/,''));}}const unique=[...new Set(urls)].slice(0,8);const data:string[]=[];for(const u of unique){const r=await fetchUrl(u);if(r.success&&!r.blocked)data.push(`=== ${u} ===\\n${r.data.slice(0,5000)}`);}if(data.length)return{success:true,data:`[Date: ${today}] [Sport: ${sport}]\\n${data.join('\\n\\n').slice(0,24000)}`,source:'fetch_matches_today:search+fetch_url'};return taloredataSearch(`football matches fixtures today ${today} kickoff times schedule`);}"
          if old not in s:
            raise SystemExit('fetchMatchesToday target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/agent/tools.ts
          git commit -m 'patch: fixture discovery uses search plus fetch_url' || exit 0
          git push
